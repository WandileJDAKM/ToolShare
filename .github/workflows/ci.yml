name: CI
on: [push, pull_request]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - run: dotnet restore ToolShare.sln
      - run: dotnet build ToolShare.sln --no-restore -c Release
      - run: dotnet test ToolShare.sln --no-build -c Release
      - run: docker build -t toolshare .
      - run: docker build -f src/ToolShare.Web/Dockerfile -t toolshare-web .
