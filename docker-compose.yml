services:
  api:
    build: { context: ., dockerfile: Dockerfile }
    ports: ["5000:8080"]
    volumes: ["toolshare-data:/data"]
  web:
    build: { context: ., dockerfile: src/ToolShare.Web/Dockerfile }
    environment:
      ApiBaseUrl: "http://api:8080/"
    ports: ["8080:8080"]
    depends_on: [api]
volumes:
  toolshare-data:
